name: Keepalive dispatch ping

# Scheduled notification campaigns are dispatched by an "opportunistic"
# middleware in backend/server.py: ANY request to /api/* triggers
# dispatch_due_campaigns() (throttled to once per 120s). Vercel's Hobby plan
# does not allow sub-daily cron jobs, so this workflow provides the regular
# API traffic that flushes due campaigns within ~5 minutes of their
# scheduled time. No secrets or code changes needed.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health (triggers due-campaign dispatch)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://f-thinkers.vercel.app/api/health)
          echo "health status: $code"
          if [ "$code" != "200" ]; then
            echo "WARNING: site did not return 200"
            exit 1
          fi
